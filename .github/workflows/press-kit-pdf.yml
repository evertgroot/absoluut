name: Build press kit PDF

# Prints the biography and technical rider of the press kit (EN/NL/IT) to A4 PDFs
# with headless Chrome, using the print styles in assets/css/press-kit.css.
# Before printing it updates the "ZIP · size" labels on the press kit to the real size of the zips,
# so a new photo or logo zip never shows an outdated size (on the page or in the PDF).
on:
  push:
    branches: [main]
    paths:
      - "absoluut/press-kit/**"
      - "nl/absoluut/press-kit/**"
      - "it/absoluut/press-kit/**"
      - "assets/css/press-kit.css"
      - "assets/css/base.css"
      - "assets/img/rider-setup.webp"
      - "assets/press-kit/*.zip"
      - "scripts/update_zip_sizes.py"
      - ".github/workflows/press-kit-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: press-kit-pdf
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the zip sizes on the press kit
        run: python3 scripts/update_zip_sizes.py
      - name: Serve the site locally
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
      - name: Print the press kit to PDF
        run: |
          mkdir -p assets/press-kit
          for lang in en nl it; do
            path="/absoluut/press-kit/"
            [ "$lang" != "en" ] && path="/$lang/absoluut/press-kit/"
            timeout 120 google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
              --run-all-compositor-stages-before-draw --window-size=1280,6000 --virtual-time-budget=8000 \
              --print-to-pdf="assets/press-kit/Absoluut-Press-Kit-${lang^^}.pdf" "http://127.0.0.1:8000$path" || true
            test -s "assets/press-kit/Absoluut-Press-Kit-${lang^^}.pdf"
            # the old file name stays as a copy, so links that were already shared keep working
            cp "assets/press-kit/Absoluut-Press-Kit-${lang^^}.pdf" "assets/press-kit/dj-absoluut-press-kit-$lang.pdf"
          done
          ls -la assets/press-kit
      - name: Save the PDFs and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add assets/press-kit absoluut/press-kit nl/absoluut/press-kit it/absoluut/press-kit
          if git diff --cached --quiet; then
            echo "The PDFs and zip sizes did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update press kit PDFs and zip sizes"
          git push
          # pushes made by this workflow do not start a Pages build on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
