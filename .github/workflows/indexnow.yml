name: Submit changed pages to IndexNow

# On every push to main that changes a page, waits until GitHub Pages has published
# that commit (or a newer one, when a later commit overtook its deploy) and then sends
# the changed pages to IndexNow (Bing, Yandex, Seznam, Naver and others).
# Each push compares with the commit before it, so no change is skipped.
# Run it by hand to submit every page in the sitemap.

on:
  push:
    branches: [main]
    paths: ["**.html", "sitemap.xml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Submit all pages
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/indexnow.py --all
      - name: Wait until the site is published
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            read -r status commit <<< "$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.status + " " + .commit')"
            git fetch -q origin main
            if [ "$status" = "built" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$commit" 2>/dev/null; then
              echo "Published ($commit)."
              exit 0
            fi
            sleep 10
          done
          echo "The site was not published within 10 minutes."
          exit 1
      - name: Submit the changed pages
        if: github.event_name == 'push'
        run: |
          base="${{ github.event.before }}"
          if ! git cat-file -e "$base" 2>/dev/null; then base="$GITHUB_SHA~1"; fi
          git diff --name-only "$base" "$GITHUB_SHA" -- '*.html' > changed.txt
          cat changed.txt
          python scripts/indexnow.py $(cat changed.txt)
