<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Evert Groot</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <style>
    /* same world as the homepage hero: near-black, white Baloo headline, teal buttons */
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0b0c;color:#fff;font-family:'Manrope',sans-serif;text-align:center}
    h1{margin:0 0 14px;font-family:'Baloo Bhai 2',sans-serif;font-size:clamp(38px,6.4vw,72px);font-weight:800;line-height:.95;letter-spacing:-0.045em}
    h1 span{color:#7bd6e0}
    p{margin:0 0 32px;font-size:17px;font-weight:500;color:rgba(255,255,255,.78)}
    nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
    a{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;border-radius:999px;background:#7bd6e0;color:#0b0b0c;font-size:16px;font-weight:800;text-decoration:none;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s ease,background-color .25s ease,border-color .25s ease}
    a:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(123,214,224,.35)}
    a.alt{background:transparent;border:2px solid rgba(255,255,255,.55);color:#fff}
    a.alt:hover{border-color:#fff;background:rgba(255,255,255,.1);box-shadow:none}
    a:focus-visible{outline:2px solid #7bd6e0;outline-offset:3px}
    @media (prefers-reduced-motion:reduce){a{transition:none}a:hover{transform:none}}
  </style>
</head>
<body>
  <main>
    <h1>This Page <span>Doesn’t Exist</span></h1>
    <p><span lang="nl">Deze pagina bestaat niet</span> · <span lang="it">Questa pagina non esiste</span></p>
    <nav aria-label="Homepage">
      <a href="/">Go to Homepage</a>
      <a class="alt" href="/nl/" hreflang="nl" lang="nl">Naar de homepage</a>
      <a class="alt" href="/it/" hreflang="it" lang="it">Vai alla homepage</a>
    </nav>
  </main>
</body>
</html>
